name: CI Pipeline

on:
  push:
    branches:
      - main
      - phase1
  pull_request:
    branches:
      - main
      - phase1
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Linting, Syntax Validation, and Unit Tests
  # ============================================================================
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run syntax linter
        run: npm run lint

      - name: Run unit & integrity test suite
        run: npm run test:unit

  # ============================================================================
  # Job 2: Docker Build & Container Health Smoke Test
  # ============================================================================
  docker:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker image (multi-stage runner)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: gemini-live-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container startup and healthcheck
        run: |
          docker run -d --name test-app -p 3000:3000 gemini-live-dashboard:ci
          # Wait and poll health endpoint
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3000/health
          # Inspect container logs
          docker logs test-app
          # Cleanup
          docker stop test-app
          docker rm test-app

      - name: Verify Docker test target
        run: |
          docker build --target test -t gemini-live-dashboard:test .
