<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>داشبورد · اتحاد الغرف</title>
<link rel="stylesheet" href="/vendor/tabulator_midnight.min.css">
<link rel="stylesheet" href="/vendor/plex/400.css"><link rel="stylesheet" href="/vendor/plex/500.css"><link rel="stylesheet" href="/vendor/plex/600.css"><link rel="stylesheet" href="/vendor/plex/700.css">
<script src="/vendor/echarts.min.js"></script>
<script src="/vendor/tabulator.min.js"></script>
<style>
  /* هوية اتحاد الغرف التجارية السعودية: كحلي + ذهبي */
  :root{
    --bg:#081726;--panel:#0e2238;--panel2:#12294390;--line:#1d3a5a;--ink:#eef2f7;--mute:#8ea3bd;--dim:#5d7591;
    --gold:#d1a65c;--sand:#e8d3a8;--steel:#5f86b3;--ok:#59c48f;--warn:#e6b450;--bad:#e0705f;
    --font:'IBM Plex Sans Arabic';--num:var(--font);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font),'IBM Plex Sans Arabic',system-ui,sans-serif}
  body{min-height:100vh}
  .wrap{padding:0 28px 18px}
  /* الشريط العلوي */
  .top{display:flex;align-items:center;gap:18px;padding:14px 28px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0b1f35,#081726)}
  .top .logo{height:46px;width:auto;display:block}
  .top .sep{width:1px;height:32px;background:var(--line)}
  .top .kicker{color:var(--mute);font-size:14px;letter-spacing:.01em}
  .top .chip{background:#14304f;border:1px solid var(--line);color:var(--sand);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:600}
  .top .meta{margin-inline-start:auto;color:var(--mute);font-size:13px;display:flex;gap:14px;align-items:center}
  .top .back{color:var(--gold);text-decoration:none;border:1px solid #2b4a6c;border-radius:8px;padding:5px 12px}
  /* العنوان والأرقام الكبيرة */
  .hero{padding:22px 0 8px}
  .hero h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.01em}
  .hero .sub{color:var(--mute);margin-top:4px;font-size:14px}
  .kpis{display:flex;flex-wrap:wrap;gap:12px 40px;margin-top:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .kpi{min-width:150px}
  .kpi .v{font-family:var(--num),var(--font),sans-serif;font-size:36px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px}
  .kpi .v small{font-family:var(--font),sans-serif;font-size:15px;font-weight:500;color:var(--mute)}
  .kpi .l{color:var(--mute);font-size:13px;margin-top:4px}
  .kpi:first-child .v{color:var(--gold)}
  .pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:#1b3553;color:var(--sand);direction:ltr;align-self:center}
  .pill.up{background:#16392e;color:var(--ok)} .pill.down{background:#3d2226;color:var(--bad)}
  /* الألواح */
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-flow:row dense;gap:16px;margin-top:18px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0;animation:rise .6s cubic-bezier(.2,.9,.2,1) both}
  .panel.span2{grid-column:span 2} .panel.full{grid-column:1/-1}
  .panel h3{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center}
  .panel h3 .tag{color:var(--gold);font-weight:700}
  .panel h3 .count{margin-inline-start:auto;color:var(--mute);font-size:12px;font-weight:500}
  .chart{height:300px} .chart.s{height:210px} .chart.l{height:420px}
  @media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:720px){.grid{grid-template-columns:1fr}.panel.span2{grid-column:auto}.top{flex-wrap:wrap;padding:12px 16px}.wrap{padding:0 16px 16px}.kpi .v{font-size:28px}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  /* مصدر البيانات (PDF) والتفاعل */
  .prov{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--mute);margin-top:10px}
  .prov b{color:var(--sand);font-weight:600}
  .prov .st{padding:2px 10px;border-radius:99px;background:#1b3553;color:var(--sand)} .prov .st.ready{background:#16392e;color:var(--ok)} .prov .st.ready_with_notes{background:#3a3218;color:var(--warn)} .prov .st.blocked{background:#3d2226;color:var(--bad)}
  .prov a{color:var(--gold)}
  .ix-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;align-items:center}
  .ix-bar label{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
  .ix-bar select{background:#0b1d31;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-family:inherit}
  .drill{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px} .drill td,.drill th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:start} .drill th{color:var(--mute);font-weight:500}
  .drill button{background:none;border:1px solid #2b4a6c;color:var(--gold);border-radius:6px;padding:2px 8px;cursor:pointer;font-family:inherit}
  .trace{font-size:12px;color:var(--mute);margin-top:8px;white-space:pre-wrap}
  /* ملخص نورة */
  .summary{border-inline-start:3px solid var(--gold)}
  .summary ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .summary li{background:#0b1d31;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;line-height:1.7}
  .summary li::before{content:"✓";color:var(--gold);margin-inline-end:8px;font-weight:700}
  /* الجداول */
  .tabulator{background:transparent;border:0;font-family:inherit;font-size:14px}
  .tabulator .tabulator-header{background:transparent;border-bottom:1px solid var(--line);color:var(--mute)}
  .tabulator .tabulator-header .tabulator-col{background:transparent;border-color:var(--line)!important}
  .tabulator .tabulator-header .tabulator-col input{background:#0b1d31!important;border:1px solid var(--line)!important;color:var(--ink)!important;border-radius:6px;padding:4px 8px!important}
  .tabulator .tabulator-header .tabulator-col .tabulator-col-content{padding:8px}
  .tabulator .tabulator-tableholder .tabulator-table{background:transparent;color:var(--ink)}
  .tabulator-row,.tabulator-row.tabulator-row-even{background:transparent;border-bottom:1px solid #16304d}
  .tabulator-row .tabulator-cell{border-color:transparent!important;padding:9px 8px}
  .tabulator-row.tabulator-selectable:hover{background:#13304f}
  .tabulator .tabulator-footer{background:transparent;border-top:1px solid var(--line);color:var(--mute)}
  .tabulator .tabulator-footer .tabulator-page{background:#0b1d31;color:var(--ink);border-color:var(--line)}
  .num{font-family:var(--num),var(--font),sans-serif;font-variant-numeric:tabular-nums}
  /* التذييل */
  .foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mute);font-size:12px;padding:14px 0 0;margin-top:18px;border-top:1px solid var(--line)}
  .embed .top .back{display:none}
  .embed body{min-height:0} .embed .top{display:none}
  @media (prefers-reduced-motion:reduce){.panel{animation:none}}
  /* v26: السطر الأهم، الأحمر للمشاكل، وش نسوي بعدها، العرض التلقائي، أبيض وأسود */
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .tbtn{min-height:44px;min-width:44px;padding:8px 14px;border-radius:10px;border:1px solid #2b4a6c;background:#0b1d31;color:var(--sand);font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
  .tbtn:hover{border-color:var(--gold)} .tbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .tbtn[aria-pressed="true"]{background:#1b3553;border-color:var(--gold);color:var(--gold)}
  .headline{margin-top:14px;padding:12px 16px;border-radius:10px;background:#0b1d31;border:1px solid var(--line);border-inline-start:4px solid var(--gold);font-size:16px;font-weight:600;line-height:1.7}
  .headline.flag{border-inline-start-color:var(--bad);background:#2a1a20}
  .headline .lbl{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:2px}
  .headline.flag .lbl{color:var(--bad)}
  .kpi.bad .v .cnt{color:var(--bad)} .kpi.good .v .cnt{color:var(--ok)}
  .kpi.bad .l::after{content:" · يحتاج انتباه";color:var(--bad)}
  .insight{margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line);color:#c9d6e6;font-size:14px;line-height:1.7}
  .insight b{color:var(--gold);font-weight:600;margin-inline-end:6px}
  .panel.hasflag h3::after{content:"فيه مشكلة";margin-inline-start:auto;font-size:12px;font-weight:600;color:var(--bad);background:#3d2226;border-radius:99px;padding:2px 10px}
  .actions{border-inline-start:3px solid var(--bad)}
  .actions ol{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:a}
  .actions li{counter-increment:a;display:grid;grid-template-columns:34px 1fr;gap:4px 12px;background:#0b1d31;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .actions li::before{content:counter(a);grid-row:span 3;width:30px;height:30px;border-radius:50%;background:#1b3553;color:var(--gold);display:grid;place-items:center;font-weight:700}
  .actions .act{font-weight:600;font-size:15px;line-height:1.6}
  .actions .imp{justify-self:start;font-size:12px;font-weight:600;color:var(--ok);background:#16392e;border-radius:99px;padding:2px 10px}
  .actions .why{color:var(--mute);font-size:13px;line-height:1.6}
  body.mono .kpi:first-child .v{color:var(--ink)} body.mono .pill.up{background:#1b3553;color:var(--sand)} body.mono .kpi.good .v .cnt{color:var(--ink)}
  body.mono .headline:not(.flag){border-inline-start-color:var(--mute)} body.mono .panel h3 .tag,body.mono .insight b,body.mono .actions li::before{color:var(--ink)}
  body.mono .actions .imp{color:var(--ink);background:#1b3553} body.mono .summary{border-inline-start-color:var(--mute)} body.mono .summary li::before{color:var(--mute)}
  body.presenting .panel,body.presenting .hero{transition:opacity .4s,box-shadow .4s}
  body.presenting .grid .panel:not(.focus){opacity:.28}
  body.presenting .panel.focus{box-shadow:0 0 0 2px var(--gold),0 18px 40px #0008}
  #cap{position:fixed;inset-inline:0;bottom:18px;margin:auto;width:min(760px,calc(100% - 32px));background:#0e2238f2;border:1px solid var(--gold);border-radius:12px;padding:12px 18px;font-size:17px;line-height:1.7;box-shadow:0 12px 40px #000a;z-index:9;display:flex;gap:12px;align-items:center}
  #cap[hidden]{display:none}
  #cap .step{color:var(--gold);font-weight:700;white-space:nowrap}
  #cap button{margin-inline-start:auto}
  @media(max-width:720px){#cap{font-size:15px}}
</style>
</head>
<body>
<header class="top">
  <img class="logo" src="/brand/fsc-logo-dark.svg" alt="اتحاد الغرف التجارية السعودية">
  <span class="sep"></span>
  <span class="kicker" id="kicker">لوحة تحليلية</span>
  <span class="chip" id="when">—</span>
  <div class="meta"><span id="by">✦ أعدّتها نورة</span><a class="back" href="/">← لوحة نورة</a></div>
</header>
<main class="wrap">
  <section class="hero"><h1 id="title">جاري التحميل…</h1><div class="sub" id="subtitle"></div><div class="headline" id="headline" hidden></div>
    <div class="tools" id="tools" hidden>
      <button type="button" class="tbtn" id="play" aria-pressed="false"><span aria-hidden="true">▶</span><span class="t">عرض تلقائي</span></button>
      <button type="button" class="tbtn" id="mono" aria-pressed="false">أبيض وأسود</button>
    </div>
    <div class="kpis" id="kpis"></div></section>
  <section class="grid" id="grid"></section>
  <div id="cap" role="status" aria-live="polite" hidden><span class="step" id="capStep"></span><span id="capText"></span><button type="button" class="tbtn" id="capStop">إيقاف</button></div>
  <footer class="foot"><span id="source"></span><span>اتحاد الغرف التجارية السعودية · وثيقة للاستخدام الداخلي</span></footer>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let LOCALE = 'ar-SA', FONT = 'IBM Plex Sans Arabic';
const fmt = n => new Intl.NumberFormat(LOCALE, { maximumFractionDigits: 2 }).format(n);
let CODE = ''; try { CODE = localStorage.getItem('accessCode') || ''; } catch {}
const id = location.pathname.split('/').pop();
const LETTERS = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح', 'ط', 'ي'];
// ألوان الرسوم من هوية الاتحاد
const PALETTE = ['#d1a65c', '#5f86b3', '#e8d3a8', '#4fb3a9', '#c97a5b', '#8fa7c4', '#9b86c9', '#7fae6e'];

// داخل الشاشة الرئيسية (iframe): نخفي زر الرجوع ونبلّغ الصفحة الأم بطول المحتوى
const EMBED = new URLSearchParams(location.search).has('embed');
if (EMBED) {
  document.documentElement.classList.add('embed');
  const post = () => parent.postMessage({ noraDashHeight: Math.ceil($('.top').getBoundingClientRect().height + $('.wrap').getBoundingClientRect().height) + 8 }, location.origin);
  new ResizeObserver(post).observe($('.wrap')); addEventListener('load', post); setTimeout(post, 1500); setTimeout(post, 3500);
}

function countUp(el, to, unit) {
  const t0 = performance.now(), d = 1400, dec = Number.isInteger(to) ? 0 : 1;
  const step = now => { const p = Math.min(1, (now - t0) / d), e = 1 - Math.pow(1 - p, 3), v = to * e;
    el.innerHTML = (dec ? new Intl.NumberFormat(LOCALE, { maximumFractionDigits: 1 }).format(v) : fmt(Math.round(v))) + (unit ? ` <small>${esc(unit)}</small>` : '');
    if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

(async () => {
  // الخط وشكل الأرقام من إعدادات الواجهة الرئيسية
  try {
    const ui = await (await fetch('/api/ui', { headers: { 'x-access-code': CODE } })).json();
    if (ui.numerals === 'latin') LOCALE = 'ar-SA-u-nu-latn';
    const clean = f => String(f || '').replace(/[^\p{L}\p{N} ]/gu, '');
    const gf = f => `<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=${encodeURIComponent(f).replace(/%20/g, '+')}:wght@400;500;600;700&display=swap">`;
    if (ui.font) FONT = clean(ui.font);
    const NUMF = ui.numFont ? clean(ui.numFont) : FONT;
    document.head.insertAdjacentHTML('beforeend', gf(FONT) + (NUMF !== FONT ? gf(NUMF) : '') + `<style>:root{--font:'${FONT}';--num:'${NUMF}'}</style>`);
    await document.fonts.load(`16px '${FONT}'`).catch(() => {});
  } catch {}

  const r = await fetch(`/api/dashboards/${id}`, { headers: { 'x-access-code': CODE } });
  if (!r.ok) { $('#title').textContent = r.status === 401 ? 'افتح لوحة نورة وادخل رمز الدخول أول' : 'الداشبورد غير موجود'; return; }
  const { spec, created_at } = await r.json();
  const when = new Date(spec.generated_at || created_at);
  document.title = `${spec.title} · اتحاد الغرف`;
  $('#title').textContent = spec.title;
  $('#subtitle').textContent = spec.subtitle || '';
  if (spec.headline) { const h = $('#headline'); h.hidden = false; h.classList.toggle('flag', !!spec.headline_flag); h.innerHTML = `<span class="lbl">${spec.headline_flag ? 'أهم مشكلة' : 'أهم نتيجة'}</span>${esc(spec.headline)}`; }
  $('#when').textContent = when.toLocaleDateString(LOCALE, { day: 'numeric', month: 'long', year: 'numeric' });
  $('#kicker').textContent = '— ' + (spec.kicker || 'لوحة تحليلية');
  if (spec.designed_by && spec.designed_by !== 'قواعد') $('#by').textContent = `✦ أعدّتها نورة · تصميم ${spec.designed_by}`;
  $('#source').textContent = `المصدر: ${spec.subtitle || 'بيانات منصة نورة'} · حُدّثت ${when.toLocaleString(LOCALE, { dateStyle: 'medium', timeStyle: 'short' })}`;

  // الأرقام الكبيرة
  spec.kpis.forEach(k => {
    const d = document.createElement('div'); d.className = 'kpi' + (k.flag ? ' ' + k.flag : '');
    const up = /^\+/.test(k.delta || ''), down = /^-/.test(k.delta || '');
    d.innerHTML = `<div class="v"><span class="cnt"></span>${k.delta ? `<span class="pill ${up ? 'up' : down ? 'down' : ''}">${esc(k.delta)}</span>` : ''}</div><div class="l">${esc(k.label)}</div>`;
    $('#kpis').append(d); countUp(d.querySelector('.cnt'), +k.value || 0, k.unit || '');
  });

  let n = 0;
  const panel = (cls, title, extra = '') => {
    const p = document.createElement('div'); p.className = 'panel ' + cls; p.style.animationDelay = `${120 + n * 90}ms`;
    p.innerHTML = `<h3><span class="tag">(${LETTERS[n % LETTERS.length]})</span>${esc(title)}${extra}</h3>`; n++;
    $('#grid').append(p); return p;
  };

  // الرسوم (ECharts) بهوية الاتحاد — والفئات اللي فيها مشكلة بالأحمر (حتى في وضع الأبيض والأسود)
  const charts = [];
  const BAD = '#e0705f', MONO = ['#c9d6e6', '#8fa7c4', '#5d7591', '#a9b8c9', '#46607c', '#e6edf5', '#7489a3', '#3a5470'];
  const norm = t => String(t ?? '').replace(/\s+/g, ' ').trim();
  function makeOpt(c, mono) {
    const opt = JSON.parse(JSON.stringify(c.option));
    delete opt.title; delete opt.backgroundColor; delete opt.color; // العنوان والألوان من الهوية
    opt.backgroundColor = 'transparent'; opt.color = mono ? MONO : PALETTE; opt.animationDuration = 1300; opt.animationEasing = 'cubicOut';
    opt.textStyle = { color: '#c9d6e6', fontFamily: `'${FONT}', 'IBM Plex Sans Arabic', sans-serif` };
    opt.tooltip = { trigger: (opt.xAxis ? 'axis' : 'item'), backgroundColor: '#0e2238', borderColor: '#2b4a6c', textStyle: { color: '#eef2f7', fontFamily: `'${FONT}', sans-serif` }, ...(opt.tooltip || {}),
      ...(LOCALE === 'ar-SA' ? { valueFormatter: v => typeof v === 'number' ? fmt(v) : v } : {}) };
    const axisStyle = ax => ({ ...ax, axisLine: { lineStyle: { color: '#2b4a6c' } }, axisTick: { show: false }, splitLine: { lineStyle: { color: '#16304d' } },
      axisLabel: { color: '#8ea3bd', ...(ax.axisLabel || {}) }, nameTextStyle: { color: '#8ea3bd' } });
    if (opt.xAxis) opt.xAxis = Array.isArray(opt.xAxis) ? opt.xAxis.map(axisStyle) : axisStyle(opt.xAxis);
    if (opt.yAxis) opt.yAxis = Array.isArray(opt.yAxis) ? opt.yAxis.map(axisStyle) : axisStyle(opt.yAxis);
    // تخطيط ثابت: وسيلة الإيضاح تحت، ومساحة كافية للتسميات
    if (opt.legend) opt.legend = [].concat(opt.legend).map(l => ({ ...l, textStyle: { color: '#c9d6e6' }, itemGap: 22, icon: 'roundRect' }));
    if (opt.xAxis || opt.yAxis) {
      if (opt.legend) opt.legend = opt.legend.map(l => ({ ...l, top: undefined, left: 'center', right: undefined, bottom: 0, orient: 'horizontal' }));
      const g = Array.isArray(opt.grid) ? opt.grid[0] : (opt.grid || {});
      opt.grid = { ...g, containLabel: true, top: 24, left: 8, right: 12, bottom: opt.legend ? 40 : 8 };
      [].concat(opt.xAxis || []).forEach(ax => { if (ax && ax.type !== 'value' && ax.type !== 'time') { const k = (ax.data || []).length; ax.axisLabel = { ...ax.axisLabel, interval: 0, rotate: k > 5 ? 25 : 0 }; } });
      if (LOCALE === 'ar-SA') [].concat(opt.xAxis || [], opt.yAxis || []).forEach(ax => { if (ax && (ax.type === 'value' || (ax.type === undefined && !ax.data))) ax.axisLabel = { ...ax.axisLabel, formatter: v => fmt(v) }; });
    }
    // الدوائر: حلقة أنيقة بحد بلون الخلفية
    [].concat(opt.series || []).forEach(s => {
      if (s.type === 'pie') { s.itemStyle = { borderColor: '#0e2238', borderWidth: 3, borderRadius: 4, ...(s.itemStyle || {}) }; s.label = { color: '#c9d6e6', ...(s.label || {}) }; }
      if (s.type === 'bar') {
        const hz = [].concat(opt.yAxis || []).some(a => a && Array.isArray(a.data));
        s.itemStyle = { borderRadius: hz ? [0, 4, 4, 0] : [4, 4, 0, 0], ...(s.itemStyle || {}) }; s.barMaxWidth ??= 46;
        // قيم على الأعمدة لما الرسم بسيط (سلسلة وحدة وفئات قليلة) — يغني عن قراءة المحور
        const n = (s.data || []).length, single = [].concat(opt.series).length === 1;
        if (single && n && n <= 12 && !s.stack) s.label = { show: true, position: hz ? 'right' : 'top', color: '#e8d3a8', fontSize: 12, ...(LOCALE === 'ar-SA' ? { formatter: p => fmt(p.value) } : {}), ...(s.label || {}) };
      }
      if (s.type === 'line') { s.lineStyle = { width: 3, ...(s.lineStyle || {}) }; s.symbolSize ??= 7; }
      delete s.itemStyle?.color;
    });
    // الأحمر: نلوّن نقاط الفئات المعلّمة فقط
    const flags = new Set((c.flag || []).map(norm));
    if (flags.size) {
      const catAx = [].concat(opt.xAxis || [], opt.yAxis || []).find(a => a && Array.isArray(a.data));
      const cats = catAx ? catAx.data.map(d => norm(d && typeof d === 'object' ? d.value : d)) : null;
      [].concat(opt.series || []).forEach(s => {
        s.data = (s.data || []).map((d, i) => {
          const name = s.type === 'pie' || s.type === 'funnel' ? norm(d && d.name) : cats ? cats[i] : null;
          if (!name || !flags.has(name)) return d;
          const o = d && typeof d === 'object' && !Array.isArray(d) ? d : { value: d };
          return { ...o, itemStyle: { ...(o.itemStyle || {}), color: BAD }, label: { ...(o.label || {}), color: BAD } };
        });
      });
    }
    return opt;
  }
  let MONO_ON = false;
  spec.charts.forEach(c => {
    const p = panel(c.span === 2 ? 'span2' : '', c.title);
    if (c.flag?.length) p.classList.add('hasflag');
    const box = document.createElement('div'); box.className = 'chart' + (c.size ? ' ' + c.size : ''); p.append(box);
    if (c.insight) p.insertAdjacentHTML('beforeend', `<p class="insight"><b>الجواب:</b>${esc(c.insight)}</p>`);
    p.dataset.say = c.insight || c.title;
    try {
      const ch = echarts.init(box, null, { renderer: 'canvas' });
      ch.setOption(makeOpt(c, false)); charts.push(ch); ch.__spec = c;
    } catch (e) { box.innerHTML = `<div style="color:var(--bad)">تعذّر الرسم: ${esc(e.message)}</div>`; }
  });
  addEventListener('resize', () => charts.forEach(c => c.resize()));

  // ملخص نورة (مثل «ملخص الأداء» في التقارير التنفيذية)
  if (spec.insights?.length) {
    // الملخص يعبّي الفراغ اللي تتركه الرسوم في آخر صف (أو ياخذ صف كامل)
    const used = spec.charts.reduce((a, c) => a + (c.span === 2 ? 2 : 1), 0) % 3;
    const p = panel(used === 0 ? 'full' : used === 1 ? 'span2' : '', 'ملخص نورة');
    p.classList.add('summary');
    p.insertAdjacentHTML('beforeend', `<ul>${spec.insights.map(s => `<li>${esc(s)}</li>`).join('')}</ul>`);
    p.dataset.say = 'ملخص نورة: ' + spec.insights.slice(0, 2).join(' ');
  }

  // وش نسوي بعدها: إجراءات مرتبة من الأكبر أثراً
  if (spec.actions?.length) {
    const p = panel('full', 'وش نسوي بعدها', `<span class="count">مرتبة من الأكبر أثراً</span>`);
    p.classList.add('actions');
    p.insertAdjacentHTML('beforeend', `<ol>${spec.actions.map(a => `<li><span class="act">${esc(a.action)}</span>${a.impact ? `<span class="imp">${esc(a.impact)}</span>` : ''}${a.why ? `<span class="why">${esc(a.why)}</span>` : ''}</li>`).join('')}</ol>`);
    p.dataset.say = 'وش نسوي بعدها: ' + spec.actions.slice(0, 3).map((a, i) => `${i + 1}) ${a.action}`).join('  ');
  }

  // الجداول (Tabulator: فرز، بحث، صفحات)
  spec.tables.forEach(t => {
    const p = panel('full', t.title, `<span class="count">${fmt(t.rows.length)} صف</span>`);
    const box = document.createElement('div'); p.append(box);
    const fields = t.columns.map((_, i) => `c${i}`);
    const data = t.rows.map(r => Object.fromEntries(fields.map((f, i) => [f, Array.isArray(r) ? r[i] : r[t.columns[i]]])));
    new Tabulator(box, {
      data, layout: 'fitColumns', textDirection: 'rtl', pagination: data.length > 12, paginationSize: 12, placeholder: 'لا توجد بيانات',
      locale: 'ar', langs: { ar: { pagination: { first: 'الأولى', first_title: 'الصفحة الأولى', last: 'الأخيرة', last_title: 'الصفحة الأخيرة', prev: 'السابقة', prev_title: 'السابقة', next: 'التالية', next_title: 'التالية', counter: { showing: 'عرض', of: 'من', rows: 'صف', pages: 'صفحة' } } } },
      columns: t.columns.map((name, i) => {
        const numeric = data.length && data.every(d => d[fields[i]] === '' || d[fields[i]] == null || !isNaN(+d[fields[i]]));
        return { title: name, field: fields[i], headerFilter: 'input', headerFilterPlaceholder: 'بحث…', sorter: numeric ? 'number' : 'string',
          formatter: cell => { const v = cell.getValue(); return numeric && v !== '' && v != null ? `<span class="num">${fmt(+v)}</span>` : esc(v); } };
      }),
    });
  });

  // مصدر البيانات: الملف والإصدار والتاريخ وحالة التحقق والصفحات والمعادلة (لوحات PDF)
  const pv = spec.provenance;
  const ST_AR = { ready: 'متحقق', ready_with_notes: 'جاهز بملاحظات', blocked: 'محجوب', text_only: 'نصي فقط' };
  if (pv) {
    const items = [['المصدر', pv.document], ['الإصدار', pv.version_id], pv.report_date && ['تاريخ التقرير', pv.report_date], pv.data_period && ['فترة البيانات', pv.data_period],
      ['عولج', pv.processed_at ? new Date(pv.processed_at).toLocaleString(LOCALE, { dateStyle: 'medium', timeStyle: 'short' }) : ''], ['الصفحات', (pv.pages || []).join('، ')], ['المعادلة', pv.formula]].filter(Boolean);
    $('.hero').insertAdjacentHTML('beforeend', `<div class="prov">${items.map(([k, v]) => `<span>${k}: <b>${esc(v || '—')}</b></span>`).join('')}<span class="st ${esc(pv.verification || '')}" title="${esc(pv.verification_note || '')}">${esc(ST_AR[pv.verification] || pv.verification || 'غير معروف')}</span>${pv.folder ? `<a href="${esc(pv.folder)}" target="_blank" rel="noopener">مجلد المصدر</a>` : ''}</div>`);
    $('#source').textContent = `المصدر: ${pv.document} · ${pv.version_id} · ${ST_AR[pv.verification] || ''}`;
  }
  // تفاعل حقيقي على صفوف المصدر: فلاتر بالأبعاد الموجودة فقط، تجميع بالكود، وتفصيل بأرقام الصفحات وتتبع كل رقم
  const ix = spec.interactive;
  const CTX = { provenance: pv || null, filters: {}, group_by: ix?.group_by || null, measure: ix?.measure || null, groups: [], selected: null };
  const sendCtx = () => { try { parent.postMessage({ noraDashCtx: { id, title: spec.title, ...CTX, groups: CTX.groups.slice(0, 30) } }, location.origin); } catch {} };
  if (ix?.rows?.length) {
    const p = panel('full', 'استكشاف البيانات', `<span class="count">${fmt(ix.rows.length)} صف تفصيلي</span>`);
    const bar = document.createElement('div'); bar.className = 'ix-bar'; p.append(bar);
    const sel = (label, opts, val, on) => { const l = document.createElement('label'); l.textContent = label; const s = document.createElement('select'); opts.forEach(([v, t]) => s.add(new Option(t, v, false, v === val))); s.onchange = () => on(s.value); l.append(s); bar.append(l); };
    sel('المقياس', ix.measures.map(m => [m, m]), CTX.measure, v => { CTX.measure = v; draw(); });
    if (ix.dimensions.length) sel('التجميع حسب', ix.dimensions.map(d => [d, d]), CTX.group_by, v => { CTX.group_by = v; draw(); });
    ix.filters.forEach(f => sel(f.dimension, [['', 'الكل'], ...f.values.map(v => [v, v])], '', v => { if (v) CTX.filters[f.dimension] = v; else delete CTX.filters[f.dimension]; draw(); }));
    const box = document.createElement('div'); box.className = 'chart'; p.append(box);
    const det = document.createElement('div'); p.append(det);
    const ch = echarts.init(box, null, { renderer: 'canvas' }); charts.push(ch); ch.__redraw = () => draw();
    const rowsNow = () => ix.rows.filter(r => Object.entries(CTX.filters).every(([d, v]) => r.dims[d] === v));
    function draw() {
      const g = new Map();
      for (const r of rowsNow()) { const v = r.values[CTX.measure]; if (v == null) continue; const k = CTX.group_by ? (r.dims[CTX.group_by] || '—') : 'الكل'; const e = g.get(k) || { key: k, value: 0, rows: [] }; e.value += v; e.rows.push(r); g.set(k, e); }
      CTX.groups = [...g.values()].sort((a, b) => b.value - a.value).map(e => ({ key: e.key, value: +e.value.toFixed(6), rows: e.rows.length }));
      const opt = { xAxis: { type: 'category', data: CTX.groups.map(e => e.key) }, yAxis: { type: 'value' }, series: [{ type: 'bar', data: CTX.groups.map(e => e.value) }] };
      ch.setOption(makeOpt({ option: opt }, MONO_ON), true);
      ch.__groups = g; showRows(null); sendCtx();
    }
    function showRows(key) {
      CTX.selected = key;
      const rs = key == null ? [] : (ch.__groups.get(key)?.rows || []);
      if (!rs.length) { det.innerHTML = `<div class="trace">اضغط عمود لعرض الصفوف ومصدرها في الملف.</div>`; return; }
      det.innerHTML = `<table class="drill"><tr>${ix.dimensions.map(d => `<th>${esc(d)}</th>`).join('')}<th>${esc(CTX.measure)}</th><th>الصفحة</th><th></th></tr>${rs.map(r => `<tr>${ix.dimensions.map(d => `<td>${esc(r.dims[d] || '')}</td>`).join('')}<td class="num">${esc(r.raw[CTX.measure] ?? '')}</td><td>${esc(r.page)}</td><td><button data-rid="${esc(r.records[CTX.measure] || '')}">من وين؟</button></td></tr>`).join('')}</table><div class="trace" id="traceOut"></div>`;
      det.querySelectorAll('button[data-rid]').forEach(b => b.onclick = async () => {
        const t = await (await fetch(`/api/ingest/trace/${encodeURIComponent(b.dataset.rid)}`, { headers: { 'x-access-code': CODE } })).json();
        $('#traceOut').textContent = t.error ? t.error : `${t.location || ''}\nالقيمة كما طُبعت: ${t.raw ?? ''} · الحالة: ${(t.verification || []).join('، ')}${t.bbox?.length ? ` · الموضع ${t.bbox.join(',')}` : ''}`;
      });
      sendCtx();
    }
    ch.on('click', e => showRows(e.name));
    p.dataset.say = 'استكشاف البيانات حسب ' + (CTX.group_by || CTX.measure);
    draw();
  } else if (pv) sendCtx();

  // أبيض وأسود: كل شي رمادي إلا المشاكل تبقى حمراء
  $('#tools').hidden = false;
  $('#mono').onclick = () => {
    MONO_ON = !MONO_ON; $('#mono').setAttribute('aria-pressed', String(MONO_ON)); document.body.classList.toggle('mono', MONO_ON);
    charts.forEach(ch => ch.__redraw ? ch.__redraw() : ch.setOption(makeOpt(ch.__spec, MONO_ON), true));
  };
  // العرض التلقائي للشاشات الكبيرة: يمر على السطر الأهم ثم كل رسم وجوابه ثم الإجراءات
  if (EMBED) { $('#play').outerHTML = `<a class="tbtn" href="/d/${id}?autoplay=1" target="_blank" rel="noopener"><span aria-hidden="true">▶</span>عرض تلقائي</a>`; }
  else {
    let timer = null, idx = 0;
    const steps = () => [...(spec.headline ? [{ el: $('.hero'), say: spec.headline }] : []), ...[...document.querySelectorAll('#grid .panel')].filter(p => p.dataset.say).map(p => ({ el: p, say: p.dataset.say }))];
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const show = () => {
      const st = steps(); if (!st.length) return stop();
      const s2 = st[idx % st.length];
      document.querySelectorAll('.panel.focus').forEach(x => x.classList.remove('focus'));
      if (s2.el.classList.contains('panel')) s2.el.classList.add('focus');
      s2.el.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
      $('#capStep').textContent = `${(idx % st.length) + 1}/${st.length}`; $('#capText').textContent = s2.say;
      idx++; timer = setTimeout(show, Math.min(14000, 5000 + s2.say.length * 60));
    };
    const start = () => { idx = 0; document.body.classList.add('presenting'); $('#cap').hidden = false; $('#play').setAttribute('aria-pressed', 'true'); $('#play .t').textContent = 'إيقاف العرض'; show(); };
    function stop() { clearTimeout(timer); timer = null; document.body.classList.remove('presenting'); document.querySelectorAll('.panel.focus').forEach(x => x.classList.remove('focus')); $('#cap').hidden = true; $('#play').setAttribute('aria-pressed', 'false'); $('#play .t').textContent = 'عرض تلقائي'; }
    $('#play').onclick = () => timer ? stop() : start();
    $('#capStop').onclick = () => { stop(); $('#play').focus(); };
    addEventListener('keydown', e => { if (e.key === 'Escape' && timer) stop(); });
    window.__dashPlay = { start, stop, steps };
    if (new URLSearchParams(location.search).has('autoplay')) setTimeout(start, 1600);
  }
})();
</script>
</body>
</html>
