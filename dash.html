<!doctype html>
<html lang="ar" dir="rtl" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>داشبورد · نورة</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.6.1/dist/css/tabler.rtl.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.6.1/dist/css/tabulator_bootstrap5.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.6.1/dist/js/tabulator.min.js"></script>
<style>
  :root{--tblr-font-sans-serif:'IBM Plex Sans Arabic',system-ui,sans-serif;--glow:#3ee6ff}
  body{background:radial-gradient(1200px 600px at 80% -10%,rgba(62,230,255,.08),transparent),var(--tblr-body-bg)}
  .page-header{animation:rise .6s ease-out both}
  .card{animation:rise .7s cubic-bezier(.2,.9,.2,1) both;border-color:rgba(62,230,255,.15)}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .kpi-val{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .kpi-val small{font-size:.9rem;font-weight:500;color:var(--tblr-secondary)}
  .chart{height:340px}
  .nora-chip{display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .7rem;border-radius:99px;background:rgba(62,230,255,.12);color:var(--glow);font-size:.8rem}
  .insight{border-inline-start:3px solid var(--glow);padding:.4rem .8rem;margin-bottom:.5rem;background:rgba(62,230,255,.05);border-radius:4px}
  .tabulator{font-family:inherit;font-size:.9rem;background:transparent}
  .tabulator .tabulator-header{background:transparent;color:var(--tblr-body-color);border-bottom-color:rgba(62,230,255,.25)}
  .tabulator .tabulator-header .tabulator-col{background:transparent}
  .tabulator .tabulator-header .tabulator-col input{background:rgba(255,255,255,.04);color:var(--tblr-body-color);border:1px solid var(--tblr-border-color)}
  .tabulator .tabulator-tableholder .tabulator-table{background:transparent;color:var(--tblr-body-color)}
  .tabulator-row,.tabulator-row.tabulator-row-even{background:transparent;color:var(--tblr-body-color)}
  .tabulator-row.tabulator-row-even{background:rgba(255,255,255,.025)}
  .tabulator-row.tabulator-selectable:hover{background:rgba(62,230,255,.08)}
  .tabulator,.tabulator-row,.tabulator-row .tabulator-cell,.tabulator .tabulator-header .tabulator-col{border-color:var(--tblr-border-color)!important}
  .tabulator .tabulator-footer{background:transparent;color:var(--tblr-body-color)}
  html{background:var(--tblr-body-bg)} body{background-attachment:fixed;min-height:100vh}
  @media (prefers-reduced-motion:reduce){.card,.page-header{animation:none}}
</style>
</head>
<body>
<div class="page">
  <div class="page-wrapper">
    <div class="page-header d-print-none"><div class="container-xl"><div class="row g-2 align-items-center">
      <div class="col"><div class="page-pretitle"><span class="nora-chip">✦ صمّمته نورة</span> <span id="when" class="ms-2"></span></div>
        <h2 class="page-title mt-2" id="title">جاري التحميل…</h2><div class="text-secondary mt-1" id="subtitle"></div></div>
      <div class="col-auto"><a href="/" class="btn btn-outline-info">← رجوع للوحة نورة</a></div>
    </div></div></div>
    <div class="page-body"><div class="container-xl">
      <div class="row row-deck row-cards" id="kpis"></div>
      <div class="row row-deck row-cards mt-1" id="charts"></div>
      <div id="tables"></div>
      <div class="row row-cards mt-1" id="insights"></div>
    </div></div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let LOCALE = 'ar-SA';
let FONT = 'IBM Plex Sans Arabic', ACC = '#3ee6ff';
const fmt = n => new Intl.NumberFormat(LOCALE, { maximumFractionDigits: 2 }).format(n);
let CODE = ''; try { CODE = localStorage.getItem('accessCode') || ''; } catch {}
const id = location.pathname.split('/').pop();
// داخل الشاشة الرئيسية (iframe): نخفي زر الرجوع ونبلّغ الصفحة الأم بالطول
const EMBED = new URLSearchParams(location.search).has('embed');
if (EMBED) {
  document.documentElement.classList.add('embed');
  document.head.insertAdjacentHTML('beforeend', '<style>.embed .page-header{display:none}.embed .page-body{margin:12px 0}.embed body,.embed .page,.embed .page-wrapper{min-height:0!important;height:auto!important}.embed body{background:transparent}</style>');
  // نقيس طول المحتوى نفسه (مو طول النافذة) عشان ما يكبر الإطار بلا نهاية
  const post = () => { const b = document.querySelector('.page-body'); if (b) parent.postMessage({ noraDashHeight: Math.ceil(b.getBoundingClientRect().height) + 24 }, location.origin); };
  new ResizeObserver(post).observe(document.querySelector('.page-body')); addEventListener('load', post); setTimeout(post, 1500); setTimeout(post, 3500);
}

function countUp(el, to, unit) {
  const t0 = performance.now(), d = 1400;
  const step = now => { const p = Math.min(1, (now - t0) / d), e = 1 - Math.pow(1 - p, 3);
    el.innerHTML = fmt(to * e) + (unit ? ` <small>${esc(unit)}</small>` : ''); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

(async () => {
  // نفس شكل الأرقام والخط اللي اختاره فواز في اللوحة الرئيسية
  try {
    const ui = await (await fetch('/api/ui', { headers: { 'x-access-code': CODE } })).json();
    if (ui.numerals === 'latin') LOCALE = 'ar-SA-u-nu-latn';
    const clean = f => String(f || '').replace(/[^\p{L}\p{N} ]/gu, '');
    const gf = f => `<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=${encodeURIComponent(f).replace(/%20/g, '+')}:wght@400;500;600;700&display=swap">`;
    if (ui.font) FONT = clean(ui.font);
    if (/^#[0-9a-f]{6}$/i.test(ui.colors?.acc || '')) ACC = ui.colors.acc;
    const NUMF = ui.numFont ? clean(ui.numFont) : FONT;
    // نفس هوية اللوحة الرئيسية: الخط، خط الأرقام، اللون الرئيسي
    document.head.insertAdjacentHTML('beforeend', gf(FONT) + (NUMF !== FONT ? gf(NUMF) : '') +
      `<style>:root{--tblr-font-sans-serif:'${FONT}','IBM Plex Sans Arabic',system-ui,sans-serif;--glow:${ACC}}body,.tabulator{font-family:'${FONT}','IBM Plex Sans Arabic',sans-serif}.kpi-val{font-family:'${NUMF}','${FONT}',sans-serif}.kpi-val small{font-family:'${FONT}',sans-serif}</style>`);
    await document.fonts.load(`16px '${FONT}'`).catch(() => {});
  } catch {}
  const r = await fetch(`/api/dashboards/${id}`, { headers: { 'x-access-code': CODE } });
  if (!r.ok) { $('#title').textContent = r.status === 401 ? 'افتح لوحة نورة وادخل رمز الدخول أول' : 'الداشبورد غير موجود'; return; }
  const { spec, created_at } = await r.json();
  document.title = `${spec.title} · نورة`;
  $('#title').textContent = spec.title;
  $('#subtitle').textContent = spec.subtitle || '';
  $('#when').textContent = new Date(spec.generated_at || created_at).toLocaleString(LOCALE, { dateStyle: 'medium', timeStyle: 'short' });

  // بطاقات الأرقام
  const kc = Math.max(1, spec.kpis.length);
  spec.kpis.forEach((k, i) => {
    const col = document.createElement('div');
    col.className = `col-sm-6 col-lg-${kc >= 4 ? 3 : 12 / kc}`;
    const up = /^\+/.test(k.delta || ''), down = /^-/.test(k.delta || '');
    col.innerHTML = `<div class="card" style="animation-delay:${i * 90}ms"><div class="card-body">
      <div class="subheader">${esc(k.label)}</div>
      <div class="d-flex align-items-baseline"><div class="kpi-val" data-v="${+k.value || 0}" data-u="${esc(k.unit || '')}">0</div>
      ${k.delta ? `<div class="ms-auto"><span dir="ltr" class="badge ${up ? 'bg-green-lt' : down ? 'bg-red-lt' : 'bg-azure-lt'}">${esc(k.delta)}</span></div>` : ''}</div></div></div>`;
    $('#kpis').append(col);
  });
  document.querySelectorAll('.kpi-val').forEach(el => countUp(el, +el.dataset.v, el.dataset.u));

  // الرسوم (ECharts)
  const charts = [];
  spec.charts.forEach((c, i) => {
    const col = document.createElement('div');
    col.className = c.span === 2 ? 'col-12' : 'col-lg-6';
    col.innerHTML = `<div class="card" style="animation-delay:${300 + i * 120}ms"><div class="card-header"><h3 class="card-title">${esc(c.title)}</h3></div>
      <div class="card-body"><div class="chart"></div></div></div>`;
    $('#charts').append(col);
    try {
      const ch = echarts.init(col.querySelector('.chart'), 'dark', { renderer: 'canvas' });
      const opt = Object.assign({ backgroundColor: 'transparent', textStyle: { fontFamily: `'${FONT}', 'IBM Plex Sans Arabic', sans-serif` },
        color: [ACC, '#7a8cff', '#3dffa8', '#ffb547', '#ff5d73', '#c38bff', '#5ab0ff'], animationDuration: 1400, animationEasing: 'cubicOut',
        tooltip: { trigger: 'item' } }, c.option);
      // كل التسميات تظهر (بدون ما يخفي ECharts بعضها)، ونميّلها لو كثيرة
      [].concat(opt.legend || []).forEach(l => { if (l) { l.itemGap ??= 22; l.textStyle = { padding: [0, 6], ...(l.textStyle || {}) }; } });
      // لو وسيلة الإيضاح تحت، نوسّع المساحة عشان ما تركب على تسميات المحور
      if (opt.xAxis || opt.yAxis) {
        // تخطيط ثابت للرسوم ذات المحاور: وسيلة الإيضاح تحت في المنتصف، ومساحة كافية لها ولتسميات المحور
        const hasLegend = !!opt.legend;
        if (hasLegend) opt.legend = [].concat(opt.legend).map(l => ({ ...l, top: undefined, left: 'center', right: undefined, bottom: 0, orient: 'horizontal' }));
        const g = Array.isArray(opt.grid) ? opt.grid[0] : (opt.grid || {});
        opt.grid = { ...g, containLabel: true, top: 28, left: 12, right: 16, bottom: hasLegend ? 44 : 12 };
      }
      opt.textStyle = { ...(opt.textStyle || {}), fontFamily: `'${FONT}', 'IBM Plex Sans Arabic', sans-serif` }; // الخط موحّد حتى لو الموديل حدد غيره
      // الأرقام في المحاور والتلميحات بنفس شكل أرقام اللوحة
      if (LOCALE === 'ar-SA') {
        [].concat(opt.xAxis || [], opt.yAxis || []).forEach(ax => { if (ax && (ax.type === 'value' || ax.type === undefined && !ax.data)) ax.axisLabel = { formatter: v => fmt(v), ...(ax.axisLabel || {}) }; });
        opt.tooltip = { valueFormatter: v => typeof v === 'number' ? fmt(v) : v, ...(opt.tooltip || {}) };
      }
      [].concat(opt.xAxis || []).forEach(ax => { if (ax && ax.type !== 'value' && ax.type !== 'time') { const n = (ax.data || []).length; ax.axisLabel = { interval: 0, rotate: n > 5 ? 25 : 0, ...(ax.axisLabel || {}) }; } });
      ch.setOption(opt); charts.push(ch);
    } catch (e) { col.querySelector('.chart').innerHTML = `<div class="text-danger">تعذّر الرسم: ${esc(e.message)}</div>`; }
  });
  addEventListener('resize', () => charts.forEach(c => c.resize()));

  // الجداول (Tabulator: فرز، بحث، صفحات)
  spec.tables.forEach((t, i) => {
    const card = document.createElement('div');
    card.className = 'card mt-3';
    card.style.animationDelay = `${600 + i * 120}ms`;
    card.innerHTML = `<div class="card-header"><h3 class="card-title">${esc(t.title)}</h3><div class="ms-auto text-secondary small">${t.rows.length} صف</div></div><div class="card-body p-0"><div></div></div>`;
    $('#tables').append(card);
    const fields = t.columns.map((_, n) => `c${n}`);
    const data = t.rows.map(r => Object.fromEntries(fields.map((f, n) => [f, Array.isArray(r) ? r[n] : r[t.columns[n]]])));
    new Tabulator(card.querySelector('.card-body > div'), {
      data, layout: 'fitColumns', textDirection: 'rtl', pagination: data.length > 12, paginationSize: 12, placeholder: 'لا توجد بيانات',
      columns: t.columns.map((name, n) => ({ title: name, field: fields[n], headerFilter: 'input', headerFilterPlaceholder: 'بحث…',
        sorter: data.every(d => d[fields[n]] === '' || !isNaN(+d[fields[n]])) ? 'number' : 'string',
        formatter: cell => { const v = cell.getValue(); return typeof v === 'number' ? fmt(v) : esc(v); } })),
    });
  });

  // ملاحظات نورة
  if (spec.insights?.length) {
    const col = document.createElement('div'); col.className = 'col-12';
    col.innerHTML = `<div class="card" style="animation-delay:800ms"><div class="card-header"><h3 class="card-title">✦ ملاحظات نورة</h3></div><div class="card-body">${spec.insights.map(s => `<div class="insight">${esc(s)}</div>`).join('')}</div></div>`;
    $('#insights').append(col);
  }
})();
</script>
</body>
</html>
